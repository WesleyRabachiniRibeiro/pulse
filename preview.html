<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InstantApp — preview da tela principal</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,500&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --base:#0B0A14;
  --superficie:#171526;
  --superficie-alta:#1E1B31;
  --linha:#2A2740;
  --violeta:#7B2FF7;
  --azul:#2AA7FF;
  --texto:#EDEBF7;
  --texto-fraco:#8B87A3;
  --menta:#3DE0B0;
  --degrade:linear-gradient(160deg,var(--violeta),var(--azul));
  --display:'Clash Display',system-ui,sans-serif;
  --ui:'General Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#050409;
  font-family:var(--ui);
  color:var(--texto);
  display:flex;align-items:center;justify-content:center;
  padding:28px;
  -webkit-font-smoothing:antialiased;
}
.janela{
  width:100%;max-width:1160px;height:min(860px,calc(100vh - 56px));
  background:var(--base);
  border:1px solid var(--linha);
  border-radius:18px;
  display:flex;overflow:hidden;
  position:relative;
}

/* trilho de progresso — a assinatura */
.trilho{width:4px;flex-shrink:0;background:rgba(42,39,64,.55);position:relative}
.trilho-fill{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--degrade);
  height:0%;
  transition:height .5s cubic-bezier(.22,1,.36,1);
}

.corpo{flex:1;display:flex;flex-direction:column;min-width:0}

/* barra de título */
.titulo-barra{
  height:44px;flex-shrink:0;display:flex;align-items:center;
  padding:0 8px 0 24px;border-bottom:1px solid var(--linha);
}
.marca{font-size:13px;font-weight:500;letter-spacing:-.01em}
.marca span{color:var(--texto-fraco);font-weight:400}
.controles{margin-left:auto;display:flex}
.controles button{
  width:42px;height:32px;background:none;border:0;color:var(--texto-fraco);
  font-size:13px;border-radius:7px;cursor:pointer;font-family:var(--ui);
}
.controles button:hover{background:var(--superficie);color:var(--texto)}
.controles button:last-child:hover{background:#FF5C7A;color:#fff}

/* conteúdo rolável */
.conteudo{flex:1;overflow-y:auto;padding:34px 40px 20px}
.conteudo::-webkit-scrollbar{width:9px}
.conteudo::-webkit-scrollbar-thumb{background:var(--linha);border-radius:9px}

.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  color:var(--texto-fraco);text-transform:uppercase;
}
h1{
  font-family:var(--display);font-size:34px;font-weight:600;
  letter-spacing:-.02em;margin:10px 0 6px;line-height:1.1;
}
.sub{font-family:var(--mono);font-size:12.5px;color:var(--texto-fraco)}

/* filtros */
.filtros{display:flex;align-items:center;gap:8px;margin:26px 0 30px;flex-wrap:wrap}
.chip{
  font-family:var(--ui);font-size:13px;font-weight:500;color:var(--texto-fraco);
  background:transparent;border:1px solid var(--linha);
  padding:8px 16px;border-radius:999px;cursor:pointer;
  transition:border-color .18s,color .18s;
}
.chip:hover{border-color:#3D3959;color:var(--texto)}
.chip[aria-pressed="true"]{
  background:var(--degrade);border-color:transparent;color:#fff;
}
.busca{
  margin-left:auto;position:relative;
}
.busca input{
  font-family:var(--ui);font-size:13px;color:var(--texto);
  background:var(--superficie);border:1px solid var(--linha);
  border-radius:999px;padding:9px 16px 9px 36px;width:210px;outline:none;
  transition:border-color .18s,width .25s;
}
.busca input:focus{border-color:var(--violeta);width:250px}
.busca input::placeholder{color:var(--texto-fraco)}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);stroke:var(--texto-fraco)}

/* seções */
.secao{margin-bottom:34px}
.secao-cabeca{
  display:flex;align-items:baseline;gap:12px;margin-bottom:14px;
  padding-bottom:10px;border-bottom:1px solid var(--linha);
}
.secao-nome{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--texto-fraco);
}
.secao-cont{font-family:var(--mono);font-size:11px;color:#4E4A6B;margin-left:auto}

.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}

/* card */
.card{
  display:flex;align-items:center;gap:13px;
  background:var(--superficie);border:1px solid var(--linha);
  border-radius:var(--r);padding:13px 14px;cursor:pointer;text-align:left;
  font-family:var(--ui);width:100%;
  transition:border-color .18s,background .18s,transform .18s;
}
.card:hover{border-color:#3D3959;background:var(--superficie-alta);transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.card[aria-pressed="true"]{border-color:#4A3A82;background:var(--superficie-alta)}

.tile{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:15px;letter-spacing:-.02em;
  filter:grayscale(1);opacity:.42;
  transition:filter .35s ease,opacity .35s ease;
}
.card[aria-pressed="true"] .tile{filter:grayscale(0);opacity:1}

.info{min-width:0;flex:1}
.nome{font-size:14px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.versao{font-family:var(--mono);font-size:11px;color:var(--texto-fraco);margin-top:3px}

.marca-check{
  width:19px;height:19px;border-radius:6px;flex-shrink:0;
  border:1.5px solid var(--linha);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .18s;
}
.card[aria-pressed="true"] .marca-check{background:var(--degrade);border-color:transparent}
.marca-check svg{opacity:0;transition:opacity .18s}
.card[aria-pressed="true"] .marca-check svg{opacity:1}

.pontos{
  width:26px;height:26px;border-radius:8px;flex-shrink:0;
  background:none;border:0;color:#4E4A6B;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.pontos:hover{background:var(--linha);color:var(--texto)}

/* rodapé */
.rodape{
  flex-shrink:0;border-top:1px solid var(--linha);
  padding:16px 40px;display:flex;align-items:center;gap:18px;
}
.resumo{font-family:var(--mono);font-size:12.5px;color:var(--texto-fraco)}
.resumo b{color:var(--texto);font-weight:500}
.limpar{
  background:none;border:0;color:var(--texto-fraco);font-family:var(--ui);
  font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;
}
.limpar:hover{color:var(--texto)}
.instalar{
  margin-left:auto;font-family:var(--ui);font-size:14px;font-weight:500;color:#fff;
  background:var(--degrade);border:0;border-radius:11px;
  padding:12px 26px;cursor:pointer;letter-spacing:-.01em;
  transition:opacity .18s,transform .18s;
}
.instalar:hover{opacity:.9;transform:translateY(-1px)}
.instalar:disabled{background:var(--superficie);color:#4E4A6B;cursor:not-allowed;transform:none}

/* folha do menu ⋮ */
.folha{
  position:absolute;top:0;right:0;bottom:0;width:390px;
  background:var(--base);border-left:1px solid var(--linha);
  transform:translateX(100%);transition:transform .32s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;z-index:5;
}
.folha.aberta{transform:translateX(0)}
.folha-cabeca{padding:26px 28px 18px;border-bottom:1px solid var(--linha)}
.folha-cabeca .eyebrow{font-size:10.5px}
.folha-cabeca h2{font-family:var(--display);font-size:21px;font-weight:600;margin-top:8px;letter-spacing:-.02em}
.folha-fechar{
  position:absolute;top:22px;right:22px;width:30px;height:30px;border-radius:8px;
  background:none;border:0;color:var(--texto-fraco);cursor:pointer;
}
.folha-fechar:hover{background:var(--superficie);color:var(--texto)}
.folha-lista{flex:1;overflow-y:auto;padding:14px 18px}
.folha-lista::-webkit-scrollbar{width:9px}
.folha-lista::-webkit-scrollbar-thumb{background:var(--linha);border-radius:9px}
.ext{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;
  cursor:pointer;background:none;border:0;width:100%;text-align:left;font-family:var(--ui);
}
.ext:hover{background:var(--superficie)}
.ext-nome{font-size:13.5px;font-weight:500;color:var(--texto)}
.ext-meta{font-family:var(--mono);font-size:10.5px;color:var(--texto-fraco);margin-top:2px}
.grupo-ext{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:#4E4A6B;padding:16px 12px 7px;
}
.folha-rodape{padding:16px 22px;border-top:1px solid var(--linha);display:flex;align-items:center}
.folha-rodape .resumo{font-size:12px}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="janela">
  <div class="trilho"><div class="trilho-fill" id="trilho"></div></div>

  <div class="corpo">
    <div class="titulo-barra">
      <div class="marca">InstantApp <span>— configuração do seu PC</span></div>
      <div class="controles">
        <button aria-label="Minimizar">&#8211;</button>
        <button aria-label="Maximizar">&#9633;</button>
        <button aria-label="Fechar">&#10005;</button>
      </div>
    </div>

    <div class="conteudo">
      <p class="eyebrow">Etapa 2 de 4</p>
      <h1>Escolha o que instalar</h1>
      <p class="sub" id="sub">19 aplicativos · 4 categorias</p>

      <div class="filtros">
        <button class="chip" data-preset="tudo" aria-pressed="false">Tudo</button>
        <button class="chip" data-preset="games" aria-pressed="false">Games</button>
        <button class="chip" data-preset="dev" aria-pressed="false">Dev</button>
        <button class="chip" data-preset="essencial" aria-pressed="false">Essencial</button>
        <div class="busca">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="busca" placeholder="Buscar aplicativo">
        </div>
      </div>

      <div id="secoes"></div>
    </div>

    <div class="rodape">
      <span class="resumo" id="resumo">Nada selecionado</span>
      <button class="limpar" id="limpar" hidden>Limpar seleção</button>
      <button class="instalar" id="instalar" disabled>Instalar</button>
    </div>
  </div>

  <aside class="folha" id="folha" aria-hidden="true">
    <div class="folha-cabeca">
      <button class="folha-fechar" id="folhaFechar" aria-label="Fechar">&#10005;</button>
      <p class="eyebrow" id="folhaEyebrow">Personalizar</p>
      <h2 id="folhaTitulo">Visual Studio Code</h2>
    </div>
    <div class="folha-lista" id="folhaLista"></div>
    <div class="folha-rodape"><span class="resumo" id="folhaResumo">Nada selecionado</span></div>
  </aside>
</div>

<script>
const APPS = [
  {g:'Navegadores', itens:[
    {id:'chrome', n:'Google Chrome', v:'152.0.7977', c:'#4285F4', mb:110, l:'C'},
    {id:'firefox', n:'Firefox', v:'155.0.1', c:'#FF7139', mb:60, l:'F'},
    {id:'brave', n:'Brave', v:'151.1.93', c:'#FB542B', mb:130, l:'B'},
    {id:'operagx', n:'Opera GX', v:'135.0.5973', c:'#FF1B2D', mb:90, l:'GX'}
  ]},
  {g:'Games', itens:[
    {id:'steam', n:'Steam', v:'2.10.91', c:'#66C0F4', mb:3, l:'S', cfg:'steam'},
    {id:'epic', n:'Epic Games', v:'1.3.193', c:'#C7C7C7', mb:60, l:'E'},
    {id:'minecraft', n:'Minecraft Launcher', v:'2.0.0', c:'#62B47A', mb:3, l:'M'},
    {id:'riot', n:'Riot Client', v:'—', c:'#D13639', mb:75, l:'R'},
    {id:'overwolf', n:'Overwolf', v:'—', c:'#FF7A00', mb:3, l:'O'}
  ]},
  {g:'Comunicação e mídia', itens:[
    {id:'discord', n:'Discord', v:'1.0.9256', c:'#5865F2', mb:100, l:'D'},
    {id:'spotify', n:'Spotify', v:'1.2.98', c:'#1DB954', mb:90, l:'S'},
    {id:'linkedin', n:'LinkedIn', v:'Store', c:'#0A66C2', mb:40, l:'in'}
  ]},
  {g:'Desenvolvimento', itens:[
    {id:'vscode', n:'Visual Studio Code', v:'1.136.1', c:'#0098FF', mb:110, l:'VS', cfg:'vscode'},
    {id:'intellij', n:'IntelliJ IDEA CE', v:'2025.2.6', c:'#FE315D', mb:950, l:'IJ'},
    {id:'git', n:'Git Bash', v:'2.55.0', c:'#F05133', mb:70, l:'G', cfg:'git'},
    {id:'jdk', n:'JDK 21 LTS', v:'21.0.12', c:'#E76F00', mb:190, l:'J'},
    {id:'claude', n:'Claude', v:'1.44121.2', c:'#D97757', mb:120, l:'C'},
    {id:'claudecode', n:'Claude Code', v:'2.1.258', c:'#D97757', mb:60, l:'CC'},
    {id:'docker', n:'Docker Desktop', v:'4.89.0', c:'#2496ED', mb:650, l:'D'}
  ]}
];

const PRESETS = {
  tudo: APPS.flatMap(s => s.itens.map(a => a.id)),
  games: ['steam','epic','minecraft','riot','overwolf','discord','operagx','chrome'],
  dev: ['vscode','intellij','git','jdk','claude','claudecode','docker'],
  essencial: ['chrome','discord','spotify']
};

const EXTENSOES = [
  {grupo:'Temas', itens:[
    {n:'Dracula Theme Official', id:'dracula-theme.theme-dracula', inst:'10,9 M'},
    {n:'One Dark Pro', id:'zhuangtongfa.material-theme', inst:'9,8 M'},
    {n:'Material Icon Theme', id:'PKief.material-icon-theme', inst:'27,4 M'}
  ]},
  {grupo:'Português', itens:[
    {n:'Pacote de idiomas pt-BR', id:'MS-CEINTL.vscode-language-pack-pt-BR', inst:'6,1 M'}
  ]},
  {grupo:'Produtividade', itens:[
    {n:'Prettier', id:'esbenp.prettier-vscode', inst:'52,3 M'},
    {n:'ESLint', id:'dbaeumer.vscode-eslint', inst:'44,7 M'},
    {n:'GitLens', id:'eamodio.gitlens', inst:'38,9 M'},
    {n:'Live Server', id:'ritwickdey.LiveServer', inst:'62,1 M'}
  ]},
  {grupo:'Linguagens', itens:[
    {n:'Python', id:'ms-python.python', inst:'148,2 M'},
    {n:'Extension Pack for Java', id:'vscjava.vscode-java-pack', inst:'32,6 M'}
  ]}
];

const sel = new Set();
const extSel = new Set(['dracula-theme.theme-dracula','MS-CEINTL.vscode-language-pack-pt-BR']);
const TOTAL = PRESETS.tudo.length;
const check = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>';

function montar(){
  document.getElementById('secoes').innerHTML = APPS.map(s => `
    <section class="secao" data-grupo="${s.g}">
      <div class="secao-cabeca">
        <span class="secao-nome">${s.g}</span>
        <span class="secao-cont">${s.itens.length}</span>
      </div>
      <div class="grade">
        ${s.itens.map(a => `
          <button class="card" data-id="${a.id}" data-nome="${a.n.toLowerCase()}" aria-pressed="false">
            <span class="tile" style="background:${a.c}22;color:${a.c}">${a.l}</span>
            <span class="info">
              <span class="nome">${a.n}</span>
              <span class="versao">${a.v}</span>
            </span>
            ${a.cfg ? `<span class="pontos" role="button" tabindex="0" data-cfg="${a.cfg}" data-app="${a.n}" aria-label="Personalizar ${a.n}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
            </span>` : ''}
            <span class="marca-check">${check}</span>
          </button>`).join('')}
      </div>
    </section>`).join('');
}

function fmt(mb){
  return mb >= 1024 ? (mb/1024).toFixed(1).replace('.',',') + ' GB' : mb + ' MB';
}

function atualizar(){
  document.querySelectorAll('.card').forEach(c =>
    c.setAttribute('aria-pressed', sel.has(c.dataset.id)));

  const todos = APPS.flatMap(s => s.itens);
  const mb = todos.filter(a => sel.has(a.id)).reduce((t,a) => t + a.mb, 0);
  const n = sel.size;

  document.getElementById('resumo').innerHTML = n
    ? `<b>${n}</b> de ${TOTAL} selecionados · <b>${fmt(mb)}</b>`
    : 'Nada selecionado';
  document.getElementById('limpar').hidden = n === 0;
  const btn = document.getElementById('instalar');
  btn.disabled = n === 0;
  btn.textContent = n ? `Instalar ${n} ${n === 1 ? 'app' : 'apps'}` : 'Instalar';
  document.getElementById('trilho').style.height = (n / TOTAL * 100) + '%';

  document.querySelectorAll('.chip').forEach(ch => {
    const p = PRESETS[ch.dataset.preset];
    ch.setAttribute('aria-pressed', p.length === n && p.every(i => sel.has(i)));
  });
}

montar();

document.getElementById('secoes').addEventListener('click', e => {
  const cfg = e.target.closest('.pontos');
  if (cfg) { e.stopPropagation(); abrirFolha(cfg.dataset.cfg, cfg.dataset.app); return; }
  const card = e.target.closest('.card');
  if (!card) return;
  sel.has(card.dataset.id) ? sel.delete(card.dataset.id) : sel.add(card.dataset.id);
  atualizar();
});

document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
  const p = PRESETS[ch.dataset.preset];
  const ativo = p.length === sel.size && p.every(i => sel.has(i));
  sel.clear();
  if (!ativo) p.forEach(i => sel.add(i));
  atualizar();
}));

document.getElementById('limpar').addEventListener('click', () => { sel.clear(); atualizar(); });

document.getElementById('busca').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  let vis = 0;
  document.querySelectorAll('.card').forEach(c => {
    const ok = c.dataset.nome.includes(q);
    c.style.display = ok ? '' : 'none';
    if (ok) vis++;
  });
  document.querySelectorAll('.secao').forEach(s =>
    s.style.display = [...s.querySelectorAll('.card')].some(c => c.style.display !== 'none') ? '' : 'none');
  document.getElementById('sub').textContent = q
    ? `${vis} ${vis === 1 ? 'resultado' : 'resultados'} para "${e.target.value.trim()}"`
    : '19 aplicativos · 4 categorias';
});

const folha = document.getElementById('folha');

function extResumo(){
  const n = extSel.size;
  document.getElementById('folhaResumo').innerHTML = n
    ? `<b>${n}</b> ${n === 1 ? 'extensão marcada' : 'extensões marcadas'}`
    : 'Nada selecionado';
}

function abrirFolha(tipo, nomeApp){
  document.getElementById('folhaTitulo').textContent = nomeApp;
  const lista = document.getElementById('folhaLista');

  if (tipo === 'vscode'){
    document.getElementById('folhaEyebrow').textContent = 'Extensões mais usadas';
    lista.innerHTML = EXTENSOES.map(g => `
      <p class="grupo-ext">${g.grupo}</p>
      ${g.itens.map(x => `
        <button class="ext" data-ext="${x.id}" aria-pressed="${extSel.has(x.id)}">
          <span class="marca-check">${check}</span>
          <span class="info">
            <span class="ext-nome">${x.n}</span>
            <span class="ext-meta">${x.inst} instalações</span>
          </span>
        </button>`).join('')}`).join('');
    lista.querySelectorAll('.ext').forEach(b => {
      b.querySelector('.marca-check').style.cssText = extSel.has(b.dataset.ext)
        ? 'background:var(--degrade);border-color:transparent' : '';
      b.querySelector('.marca-check svg').style.opacity = extSel.has(b.dataset.ext) ? 1 : 0;
    });
  } else if (tipo === 'steam'){
    document.getElementById('folhaEyebrow').textContent = 'Seus jogos';
    lista.innerHTML = `<p class="grupo-ext">Depois de instalar</p>
      <div style="padding:12px;color:var(--texto-fraco);font-size:13px;line-height:1.65">
        Abra o Steam e faça login. Sua biblioteca aparece aqui e você escolhe
        o que baixar — sem precisar de chave de API.
      </div>`;
  } else {
    document.getElementById('folhaEyebrow').textContent = 'Identidade do Git';
    lista.innerHTML = `<p class="grupo-ext">Usado nos seus commits</p>
      <div style="padding:12px;color:var(--texto-fraco);font-size:13px;line-height:1.65">
        Nome, e-mail e branch padrão. Preenchemos <code style="font-family:var(--mono);color:var(--azul)">main</code>
        como padrão — dá para mudar.
      </div>`;
  }

  extResumo();
  folha.classList.add('aberta');
  folha.setAttribute('aria-hidden','false');
}

document.getElementById('folhaLista').addEventListener('click', e => {
  const b = e.target.closest('.ext');
  if (!b) return;
  const id = b.dataset.ext;
  extSel.has(id) ? extSel.delete(id) : extSel.add(id);
  const m = b.querySelector('.marca-check');
  m.style.cssText = extSel.has(id) ? 'background:var(--degrade);border-color:transparent' : '';
  m.querySelector('svg').style.opacity = extSel.has(id) ? 1 : 0;
  extResumo();
});

document.getElementById('folhaFechar').addEventListener('click', () => {
  folha.classList.remove('aberta');
  folha.setAttribute('aria-hidden','true');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('folhaFechar').click();
});

PRESETS.essencial.forEach(i => sel.add(i));
atualizar();
</script>
</body>
</html>
