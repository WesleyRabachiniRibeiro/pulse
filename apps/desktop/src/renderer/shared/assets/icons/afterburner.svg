<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="#000000">
  <!-- Anel externo. Dois círculos com evenodd vazam o meio, o que mantém o
       arquivo como silhueta de uma cor só e o deixa servir de máscara. -->
  <path fill-rule="evenodd" d="M32 2a30 30 0 1 1 0 60 30 30 0 0 1 0-60zm0 6a24 24 0 1 0 0 48 24 24 0 0 0 0-48z"/>

  <!-- Três pás, a mesma forma girada 120° em torno do centro. -->
  <g>
    <path d="M32 14c6.2 0 11.4 4.1 13.1 9.8-3.3-2.4-7.6-3.4-11.9-2.3l-3.5.9 1-3.5c.4-1.6 1.2-3.4 1.3-4.9z" transform="rotate(0 32 32)"/>
    <path d="M32 14c6.2 0 11.4 4.1 13.1 9.8-3.3-2.4-7.6-3.4-11.9-2.3l-3.5.9 1-3.5c.4-1.6 1.2-3.4 1.3-4.9z" transform="rotate(120 32 32)"/>
    <path d="M32 14c6.2 0 11.4 4.1 13.1 9.8-3.3-2.4-7.6-3.4-11.9-2.3l-3.5.9 1-3.5c.4-1.6 1.2-3.4 1.3-4.9z" transform="rotate(240 32 32)"/>
  </g>

  <!-- Cubo central -->
  <circle cx="32" cy="32" r="6"/>
</svg>
