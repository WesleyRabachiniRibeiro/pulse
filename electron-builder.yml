appId: com.pulse.installer
productName: Pulse
copyright: Pulse

directories:
  output: D:/Pulse-build
  buildResources: build

files:
  - out/**/*
  - package.json

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: Pulse-${version}-setup.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pulse
  installerLanguages:
    - pt_BR

portable:
  artifactName: Pulse-${version}-portable.exe
